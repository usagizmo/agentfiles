<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Rabi 主画面</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      アプリの主画面を 1 枚の絵にした面。**手書き**で、生成物ではない。

      向き（この 3 つを他の面より優先して見る）:

      - 密度は道具寄り —— 行は詰め、余白で語らない
      - 朱は差し色 —— 主操作と現在地だけ。面を塗らない
      - 面は平面 —— 沈んだ地の上に面が乗る。境は面の明暗が作り、影は落とさない

      文言・数値はすべて置き換えの例示で、実在の製品を指さ**ない**。
      部品の見た目はここに書かない（`assets/rabi-components.css` が持つ）。
    -->
    <link rel="stylesheet" href="../agents/skills/rabi-design/assets/rabi.css" />
    <link rel="stylesheet" href="../agents/skills/rabi-design/assets/rabi-components.css" />
    <link rel="stylesheet" href="surfaces.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      svg {
        display: block;
      }

      [hidden] {
        display: none;
      }

      /* ==== 窓 ====
         沈んだ地。この上に面が浮く。地そのものは操作を持たない */
      .win {
        display: grid;
        grid-template-rows: 1fr auto;
        height: 100vh;
        padding: var(--rabi-gap-3);
        gap: var(--rabi-gap-2);
      }

      .work {
        display: grid;
        grid-template-columns: auto 240px minmax(0, 1fr) 300px;
        gap: var(--rabi-gap-3);
        min-height: 0;
      }

      /* ==== レール ====
         図だけの縦列。面では**なく**地の上に直接置く（浮かせると 2 枚重なる） */
      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--rabi-gap-1);
        padding-block: var(--rabi-gap-1);
      }

      .rail-gap {
        flex: 1;
      }

      /* 中身だけが流れる帯。面そのものには丈を書か**ない**（`.rabi-panel` が
         `overflow: hidden` を持つので、格子の枡より縮める） */
      .pane-scroll {
        flex: 1;
        overflow: auto;
      }

      /* 暦は幅を測って置く。行の一覧とは別の塊 */
      .cal-slot {
        display: grid;
        justify-items: center;
        padding: var(--rabi-gap-3);
      }

      /* ==== キャンバス ====
         格子は地の模様。面では**ない**ので、面の色ではなく罫の色で引く */
      .canvas {
        position: relative;
        min-height: 0;
        border-radius: var(--rabi-r-lg);
        background-color: var(--rabi-ground);
        background-image:
          linear-gradient(var(--rabi-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--rabi-line) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* 島は面の上中央に浮く。流れの中に置くと内容がその丈ぶん下がる */
      .canvas-island {
        position: absolute;
        top: var(--rabi-gap-3);
        left: 50%;
        translate: -50% 0;
      }

      /* 置き換えのノード。中身は対象外なので、位置と塊だけを示す */
      .node {
        position: absolute;
        width: 200px;
      }

      .node-a {
        top: 96px;
        left: 72px;
      }

      .node-b {
        top: 216px;
        left: 336px;
      }

      .node-c {
        top: 92px;
        left: 372px;
      }

      /* ==== 会話 ==== */
      .chat-scroll {
        display: grid;
        flex: 1;
        overflow: auto;
        align-content: center;
        justify-items: center;
        padding-inline: var(--rabi-gap-3);
      }

      .chat-suggest {
        display: grid;
        gap: var(--rabi-gap-1_5);
        justify-items: stretch;
        padding: var(--rabi-gap-3);
      }

      .chat-foot {
        padding: var(--rabi-gap-3);
        padding-top: 0;
      }

      /* ==== 窓の下端 ====
         帯は面を持たない。地の上に字だけを置く */
      .status {
        display: grid;
        padding-inline: var(--rabi-gap-2);
      }
    </style>
  </head>

  <body>
    <div class="win">
      <div class="work">
        <!-- レール -->
        <nav class="rail" aria-label="道具">
          <button class="rabi-btn rabi-btn-sm rabi-btn-ghost rabi-btn-icon" type="button" aria-label="棚" aria-pressed="true">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 4.5h4l1.5 2h7.5v8h-13z" /></svg>
          </button>
          <button class="rabi-btn rabi-btn-sm rabi-btn-ghost rabi-btn-icon" type="button" aria-label="探す">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="4.5" /><path d="M11.5 11.5 15 15" /></svg>
          </button>
          <button class="rabi-btn rabi-btn-sm rabi-btn-ghost rabi-btn-icon" type="button" aria-label="予定">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="3.5" width="15" height="13" /><path d="M1.5 7.5h15M5.5 1.5v4M12.5 1.5v4" /></svg>
          </button>
          <button class="rabi-btn rabi-btn-sm rabi-btn-ghost rabi-btn-icon" type="button" aria-label="履歴">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" /><path d="M9 5v4l2.5 2" /></svg>
          </button>
          <span class="rail-gap"></span>
          <button class="rabi-btn rabi-btn-sm rabi-btn-ghost rabi-btn-icon" type="button" aria-label="設定">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.5" /><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" /></svg>
          </button>
        </nav>

        <!-- 棚 -->
        <div class="rabi-panel">
          <div class="rabi-panel-head">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 4.5h4l1.5 2h7.5v8h-13z" /></svg>
            <span>棚</span>
            <div class="rabi-panel-action">
              <button class="rabi-btn rabi-btn-xs rabi-btn-ghost rabi-btn-icon" type="button" aria-label="足す">
                <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11" /></svg>
              </button>
            </div>
          </div>

          <div class="pane-scroll">
            <div class="rabi-panel-body">
              <input class="rabi-input-line" type="search" aria-label="棚を探す" placeholder="探す" />

            <div class="rabi-tree">
              <button class="rabi-tree-row" type="button">置き換えの棚</button>
              <div class="rabi-tree">
                <button class="rabi-tree-row" type="button">日々</button>
                <div class="rabi-tree">
                  <button class="rabi-tree-row" type="button" aria-selected="true">2026-08-30</button>
                  <button class="rabi-tree-row" type="button">2026-08-29</button>
                  <button class="rabi-tree-row" type="button">2026-08-28</button>
                </div>
                <button class="rabi-tree-row" type="button">読み物</button>
                <button class="rabi-tree-row" type="button">下書き</button>
                </div>
              </div>
            </div>
          </div>

          <div class="cal-slot">
            <div class="rabi-calendar" aria-label="置き換えの暦">
              <span class="rabi-cal-weekday">日</span>
              <span class="rabi-cal-weekday">月</span>
              <span class="rabi-cal-weekday">火</span>
              <span class="rabi-cal-weekday">水</span>
              <span class="rabi-cal-weekday">木</span>
              <span class="rabi-cal-weekday">金</span>
              <span class="rabi-cal-weekday">土</span>
              <button class="rabi-cal-day" type="button">24</button>
              <button class="rabi-cal-day" type="button">25</button>
              <button class="rabi-cal-day" type="button">26</button>
              <button class="rabi-cal-day" type="button">27</button>
              <button class="rabi-cal-day" type="button">28</button>
              <button class="rabi-cal-day" type="button">29<span class="rabi-cal-dot"></span></button>
              <button class="rabi-cal-day" type="button" aria-selected="true" aria-current="date">30</button>
              <button class="rabi-cal-day" type="button">31</button>
              <button class="rabi-cal-day" type="button">1</button>
              <button class="rabi-cal-day" type="button">2</button>
              <button class="rabi-cal-day" type="button">3</button>
              <button class="rabi-cal-day" type="button">4</button>
              <button class="rabi-cal-day" type="button">5</button>
              <button class="rabi-cal-day" type="button">6</button>
            </div>
          </div>
        </div>

        <!-- キャンバス -->
        <div class="canvas">
          <div class="rabi-island canvas-island" aria-label="いまの面">
            <button class="rabi-island-tab" type="button" aria-selected="true">ノート</button>
            <button class="rabi-island-tab" type="button" aria-selected="false">タスク</button>
            <span class="rabi-island-rule"></span>
            <button class="rabi-date-pill" type="button">8/30</button>
          </div>

          <div class="rabi-card node node-a">
            <div class="rabi-card-title">
              <svg class="ico ico-stacked" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8L18.5 8v12.5h-13z" /><path d="M14 3.5V8h4.5" /></svg>
              <span>置き換えの節</span>
            </div>
            <p>置き換えの本文。ノードの中身は対象外なので、塊としての形だけを見る。</p>
          </div>

          <div class="rabi-card node node-c">
            <div class="rabi-card-title">
              <svg class="ico ico-stacked" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2" /><rect x="13" y="13" width="8" height="8" rx="2" /><path d="M11 7h4a2 2 0 0 1 2 2v4" /></svg>
              <span>置き換えの問い</span>
            </div>
            <p>2 枚目。重なりの順と影の強さだけを見る。</p>
          </div>

          <div class="rabi-card node node-b">
            <div class="rabi-card-title">
              <svg class="ico ico-stacked" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M12 4v16" /></svg>
              <span>置き換えの手</span>
            </div>
            <ul class="rabi-checklist">
              <li>置き換えの項目</li>
              <li>置き換えの項目</li>
            </ul>
          </div>
        </div>

        <!-- 会話 -->
        <div class="rabi-panel">
          <div class="rabi-panel-head">
            <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 3.5h13v9h-8l-3.5 3z" /></svg>
            <span>会話</span>
            <div class="rabi-panel-action">
              <button class="rabi-btn rabi-btn-xs rabi-btn-ghost rabi-btn-icon" type="button" aria-label="履歴">
                <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" /><path d="M9 5v4l2.5 2" /></svg>
              </button>
              <button class="rabi-btn rabi-btn-xs rabi-btn-ghost rabi-btn-icon" type="button" aria-label="新しい会話">
                <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11" /></svg>
              </button>
            </div>
          </div>

          <div class="chat-scroll">
            <div class="rabi-empty">
              <svg class="ico ico-stacked" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16c-2 0-4-2.2-4-5s2-5 5-5 5 2.2 5 5v1h1c1.7 0 3 1.3 3 3s-1.3 3-3 3H8z" /></svg>
              <p class="rabi-empty-title">会話を始める</p>
              <p>置き換えの説明。近いノードを辿って、問いに答えます。</p>
            </div>
          </div>

          <div class="chat-suggest">
            <button class="rabi-btn rabi-btn-sm rabi-btn-secondary" type="button">今週を要約する</button>
            <button class="rabi-btn rabi-btn-sm rabi-btn-secondary" type="button">近い問いを探す</button>
            <button class="rabi-btn rabi-btn-sm rabi-btn-secondary" type="button">手を 1 つ決める</button>
          </div>

          <div class="chat-foot">
            <div class="rabi-chat-input">
              <div class="rabi-chat-input-actions">
                <button class="rabi-btn rabi-btn-sm rabi-btn-ghost rabi-btn-icon" type="button" aria-label="足す">
                  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11" /></svg>
                </button>
              </div>
              <textarea class="rabi-textarea" rows="1" aria-label="会話の入力" placeholder="ノートについて聞く"></textarea>
              <div class="rabi-chat-input-actions">
                <button class="rabi-btn rabi-btn-sm rabi-btn-primary rabi-btn-icon" type="button" aria-label="送る">
                  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 15.5L15.5 9 3 2.5v5l7 1.5-7 1.5z" /></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 窓の下端 -->
      <div class="status">
        <div class="rabi-statusbar">
        <span class="rabi-statusbar-value">置き換えの棚</span>
        <span class="rabi-statusbar-value"><span class="rabi-statusbar-on"></span>同期済み</span>
        <span class="rabi-statusbar-value">ノード 24</span>
        <span class="rabi-statusbar-value">20:02</span>
        </div>
      </div>
    </div>

    <script src="surfaces.js"></script>
  </body>
</html>
