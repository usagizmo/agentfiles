# consult のアドバイザー候補。選出と members の意味・省略時は advisors.ts の
# selectAdvisors / parseRoster。read-only 手段は advisors.ts の readOnlyArgs が末尾に足す。
#
# args は `herdr agent start <名前> --kind <kind> --pane <id> --` 以降。
# 空配列ならその kind の harness 既定。
#
# claude / opus 5 high:
#   kind = "claude"
#   args = ["--model", "claude-opus-5", "--effort", "high"]
#
# codex / gpt-5.6 high:
#   kind = "codex"
#   args = ["--model", "gpt-5.6", "-c", "model_reasoning_effort=high"]
#
# 3 枠目は cursor 経由に差し替えられる（members は変えない）:
#   kind = "cursor"
#   args = ["--model", "cursor-grok-4.6-high"]
# cursor の実行ファイルは cursor-agent。kind は cursor。

[[advisors]]
kind = "claude"
args = []

[[advisors]]
kind = "codex"
args = []

[[advisors]]
kind = "grok"
args = ["--model", "grok-4.6", "--effort", "high"]
members = ["grok", "cursor"]
