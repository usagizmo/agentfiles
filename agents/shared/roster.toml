# 起こす agent の kind と args。
# args は `herdr agent start <名前> --kind <kind> --pane <id> --` 以降。
# 空配列ならその kind の harness 既定。
# cursor の実行ファイルは cursor-agent。kind は cursor。
#
# claude / opus 5 high:
#   kind = "claude"
#   args = ["--model", "claude-opus-5", "--effort", "high"]
#
# codex / gpt-5.6 high:
#   kind = "codex"
#   args = ["--model", "gpt-5.6", "-c", "model_reasoning_effort=high"]

# consult / zero-base-loop のアドバイザー候補。選出と members の意味・省略時は advisors.ts の
# selectAdvisors / parseRoster。read-only 手段は advisors.ts の readOnlyArgs が末尾に足す。

[[advisors]]
kind = "claude"
args = []

[[advisors]]
kind = "codex"
args = []

# grok を起こすときは [executors.resolve] の kind と args に差し替える。members は変えない。
[[advisors]]
kind = "cursor"
args = ["--model", "cursor-grok-4.6-high"]
members = ["grok", "cursor"]

# conductor が工程ごとに起こす実行器。検証は conductor の config.ts。

[executors.refine]
kind = "cursor"
args = ["--model", "cursor-grok-4.6-high"]

[executors.resolve]
kind = "grok"
args = ["--model", "grok-4.6", "--effort", "high"]
