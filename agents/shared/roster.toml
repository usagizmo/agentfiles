# consult のアドバイザー候補（advisors）と dispatch の実装役の候補（workers。先頭が既定）。
# 解釈と検証は roster.ts の parseRoster。選出は agents/shared/advisors.ts の selectAdvisors（表の順が優先順）。
# advisors の read-only 手段は roster.ts の readOnlyArgs が末尾に足す。workers には足さない。
# DISPATCH_KIND は workers の表から引く。表に無い kind は起動しない。
#
# args は interactive CLI の追加引数（バイナリ名は kind。cursor は cursor-agent）。
# 空配列ならその kind の harness 既定。
#
# claude / opus 5 high:
#   kind = "claude"
#   args = ["--model", "claude-opus-5", "--effort", "high"]
#
# codex / gpt-5.6 high:
#   kind = "codex"
#   args = ["--model", "gpt-5.6", "-c", "model_reasoning_effort=high"]
#
# workers は承認で止めない起動を置く（背面で動く）。advisors には置かない。
#
# opencode に effort の flag は無い。effort は harnesses/opencode/opencode.json。

[[advisors]]
kind = "codex"
args = []

[[advisors]]
kind = "claude"
args = []

[[workers]]
kind = "claude"
args = ["--model", "claude-opus-5-5", "--effort", "low", "--permission-mode", "bypassPermissions"]

[[workers]]
kind = "codex"
args = [
  "--model",
  "gpt-6-luna",
  "-c",
  "model_reasoning_effort=max",
  "--dangerously-bypass-approvals-and-sandbox",
]

[[workers]]
kind = "cmd"
args = ["--model", "deepseek/deepseek-v4.1-flash", "--effort", "max", "--yolo"]

[[workers]]
kind = "opencode"
args = ["--model", "opencode-go/deepseek-v4.1-flash", "--auto"]

[[workers]]
kind = "grok"
args = ["--model", "grok-4.6", "--effort", "high", "--permission-mode", "bypassPermissions"]

[[workers]]
kind = "cursor"
args = ["--model", "cursor-grok-4.6-high", "--force"]

[[workers]]
kind = "devin"
args = ["--model", "swe-2-high", "--permission-mode", "dangerous"]
