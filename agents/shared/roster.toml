# consult のアドバイザー候補（advisors）と resolve の実装役（resolve）。
# 解釈と検証は roster.ts の parseRoster。選出は agents/shared/advisors.ts の selectAdvisors（表の順が優先順）。
# advisors の read-only 手段は roster.ts の readOnlyArgs が末尾に足す。resolve には足さない。
#
# args は interactive CLI の追加引数（バイナリ名は kind。cursor は cursor-agent）。
# 空配列ならその kind の harness 既定。
#
# claude / opus 5 high:
#   kind = "claude"
#   args = ["--model", "claude-opus-5", "--effort", "high"]
#
# codex / gpt-5.6 high:
#   kind = "codex"
#   args = ["--model", "gpt-5.6", "-c", "model_reasoning_effort=high"]
#
# devin / SWE-2 high:
#   kind = "devin"
#   args = ["--model", "swe-2-high", "--permission-mode", "dangerous"]
#
# OpenCode Go / Command Code の既定モデルは各 harness overlay。

[[advisors]]
kind = "codex"
args = []

[[advisors]]
kind = "claude"
args = []

[[advisors]]
kind = "grok"
args = ["--model", "grok-4.6", "--effort", "high"]

[[advisors]]
kind = "cursor"
args = ["--model", "cursor-grok-4.6-high"]

[resolve]
kind = "devin"
args = ["--model", "swe-2-high", "--permission-mode", "dangerous"]
